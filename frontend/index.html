<!DOCTYPE html>
<html>
<head>
    <title>CareerPath AI</title>
</head>

<body>

<h1>CareerPath AI</h1>
<p>Tell me your dream job and I'll help you build a roadmap.</p>

<div id="messages"></div>

<input
        type="text"
        id="userInput"
        placeholder="Example: I want to become a software engineer"
>

<button onclick="sendMessage()">Send</button>

<script>
    async function sendMessage() {

        const input = document.getElementById("userInput");
        const message = input.value.trim();

        if (!message) return;

        const messages = document.getElementById("messages");

        messages.innerHTML +=
            "<p><b>You:</b> " + message + "</p>";

        input.value = "";

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        messages.innerHTML +=
            "<p><b>CareerPath AI:</b> " + data.reply + "</p>";
    }
</script>

</body>
</html>
